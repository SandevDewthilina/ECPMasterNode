version: '3.1'
services:
  keycloak:
    container_name: keycloak
    image: keycloak:latest
    command: start
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8443:8443"
    extra_hosts:
      - "localhost:host-gateway"