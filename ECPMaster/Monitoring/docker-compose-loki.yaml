version: '3.1'

volumes:
  loki-data:
    driver: local

services:
  loki:
    image: grafana/loki:2.4.0
    volumes:
      - loki-data:/etc/loki
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports:
      - "3100:3100"
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml